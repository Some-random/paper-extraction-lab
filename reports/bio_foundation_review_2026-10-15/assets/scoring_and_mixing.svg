<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1038" viewBox="0 0 1120 1038" role="img" aria-labelledby="title desc">
<title id="title">Choose the scorer and data mixture</title><desc id="desc">Proposed CPT recipe inspired by FineWeb-Edu, OLMo 3, DCLM and OpenThoughts3. LLM labels plus human review train and validate a scorer. Compare choices with a fixed checkpoint and budget; preserve final tests. OpenThoughts3 concerns reasoning SFT.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8292a6"/></marker></defs>
<rect width="1120" height="1038" rx="18" fill="#f8fafc"/>
<text x="32" y="49" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#24354a" font-weight="700">Choose the scorer and data mixture</text>
<text x="32" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#53657b">Judge the recipe by training gains, not the score alone</text>
<rect x="32" y="112" width="508" height="264" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="56" y="149" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24354a" font-weight="700">Build and audit the scorer</text>
<text x="56" y="184" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">LLM labels: relevance + substantive biology</text>
<text x="56" y="214" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Human-reviewed sample → trained scorer</text>
<text x="56" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Validate against held-out human labels</text>
<text x="56" y="274" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Evidence spans are for audit, not scoring</text>
<text x="56" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Score prose; validate other modalities by type</text>
<text x="56" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">FineWeb-Edu</text><a href="https://arxiv.org/html/2406.17557v1#S4"><rect x="54" y="334" width="107.921" height="23" fill="#ffffff" fill-opacity="0"/></a>
<text x="167.92099958658218" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">·</text>
<text x="181.92099958658218" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">OLMo 3</text><a href="https://arxiv.org/html/2512.13961v2#S3.SS4"><rect x="179.921" y="334" width="64.469" height="23" fill="#ffffff" fill-opacity="0"/></a>
<rect x="580" y="112" width="508" height="264" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="604" y="149" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24354a" font-weight="700">Compare sources and mixtures</text>
<text x="604" y="184" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Group by source, topic and modality</text>
<text x="604" y="214" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Compare sources and sampling ratios</text>
<text x="604" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Measure each source&#x27;s added value</text>
<text x="604" y="274" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Track general-text replay separately</text>
<text x="604" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">More sources need not improve the model</text>
<text x="604" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">OLMo 3</text><a href="https://arxiv.org/html/2512.13961v2#S3.SS4"><rect x="602" y="334" width="64.469" height="23" fill="#ffffff" fill-opacity="0"/></a>
<text x="672.468999683857" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">·</text>
<text x="686.468999683857" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">OpenThoughts3</text><a href="https://arxiv.org/html/2506.04178v2#S4"><rect x="684.469" y="334" width="125.907" height="23" fill="#ffffff" fill-opacity="0"/></a>
<path d="M286 376V400H560" fill="none" stroke="#8292a6" stroke-width="2"/>
<path d="M834 376V400H560" fill="none" stroke="#8292a6" stroke-width="2"/>
<path d="M560 400V424" fill="none" stroke="#8292a6" stroke-width="2"/><polygon points="560,424 555,415 565,415" fill="#8292a6"/>
<rect x="32" y="426" width="1056" height="168" rx="12" fill="#eaf1fa" stroke="#b9cce5" stroke-width="1.5"/>
<text x="56" y="463" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24354a" font-weight="700">Run controlled continued-pretraining comparisons</text>
<text x="56" y="498" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Same checkpoint and token budget; vary sources, filters, teachers and ratios</text>
<text x="56" y="528" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Choose using development tasks; keep final tests untouched</text>
<text x="56" y="570" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">OpenThoughts3</text><a href="https://arxiv.org/html/2506.04178v2#S4"><rect x="54" y="552" width="125.907" height="23" fill="#ffffff" fill-opacity="0"/></a>
<text x="185.9069990515709" y="570" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">·</text>
<text x="199.9069990515709" y="570" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">DCLM</text><a href="https://arxiv.org/html/2406.11794v3"><rect x="197.907" y="552" width="52.161" height="23" fill="#ffffff" fill-opacity="0"/></a>
<path d="M560 594V644" fill="none" stroke="#8292a6" stroke-width="2"/><polygon points="560,644 555,635 565,635" fill="#8292a6"/>
<rect x="32" y="646" width="1056" height="176" rx="12" fill="#eaf5ef" stroke="#bcd6c7" stroke-width="1.5"/>
<text x="56" y="683" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24354a" font-weight="700">Freeze the recipe, then scale</text>
<text x="56" y="718" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Set source weights, select / sample records, and pack with the training tokenizer</text>
<text x="56" y="748" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Count retained and consumed tokens: papers / web URLs / existing datasets</text>
<text x="56" y="778" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Break out modality counts; distinguish biology from general-text replay</text>
<text x="56" y="798" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">OLMo 3</text><a href="https://arxiv.org/html/2512.13961v2#S3.SS4"><rect x="54" y="780" width="64.469" height="23" fill="#ffffff" fill-opacity="0"/></a>
<rect x="32" y="858" width="1056" height="148" rx="12" fill="#f0f2f6" stroke="#f0f2f6" stroke-width="1.5"/>
<text x="56" y="895" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24354a" font-weight="700">Borrow OpenThoughts3&#x27;s experiment design</text>
<text x="56" y="930" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">Its question difficulty, multiple answers and answer filters belong to reasoning SFT.</text>
<text x="56" y="960" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24354a">For raw-paper CPT, validate the benefit instead of copying those choices.</text>
<text x="56" y="982" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#315f97">OpenThoughts3</text><a href="https://arxiv.org/html/2506.04178v2#S4"><rect x="54" y="964" width="125.907" height="23" fill="#ffffff" fill-opacity="0"/></a>
</svg>
